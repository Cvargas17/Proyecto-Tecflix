<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TecFlix</title>
<style>
  :root { --bg:#141414; --panel:#1f1f1f; --line:#333; --text:#f2f2f2; --dim:#9a9a9a; --red:#e50914; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:24px; padding:14px 24px; background:#000; position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  .logo { color:var(--red); font-weight:900; font-size:28px; letter-spacing:1px; cursor:pointer; }
  nav { display:flex; gap:6px; flex:1; }
  nav button, .btn { background:none; border:0; color:var(--text); padding:8px 14px; border-radius:4px; cursor:pointer; font:inherit; }
  nav button:hover { background:#2a2a2a; }
  nav button.active { font-weight:700; border-bottom:2px solid var(--red); border-radius:0; }
  .btn { background:#333; } .btn:hover { background:#444; }
  .btn.red { background:var(--red); } .btn.red:hover { background:#f6121d; }
  .btn.danger { background:#7a1016; }
  main { padding:24px; max-width:1300px; margin:0 auto; }
  h2 { margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .card { background:var(--panel); border-radius:6px; overflow:hidden; cursor:pointer; transition:transform .15s; }
  .card:hover { transform:scale(1.03); }
  .card video { width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; display:block; pointer-events:none; }
  .card .info { padding:10px 12px; }
  .card .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dim { color:var(--dim); font-size:13px; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#333; margin-left:6px; vertical-align:middle; }
  .badge.public { background:#1d5e2f; } .badge.private { background:#6b4a10; }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:30px 12px; z-index:10; }
  .modal.open { display:flex; }
  .box { background:var(--panel); border-radius:8px; width:100%; max-width:960px; padding:20px; position:relative; }
  .box.small { max-width:380px; }
  .close { position:absolute; right:12px; top:8px; font-size:26px; cursor:pointer; color:var(--dim); background:none; border:0; }
  .player { width:100%; max-height:62vh; background:#000; border-radius:6px; }
  table { border-collapse:collapse; width:100%; margin-top:10px; }
  td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; }
  td:first-child { color:var(--dim); width:36%; }
  input[type=text],input[type=password],select,input[type=file] { width:100%; padding:9px; margin:4px 0 12px; background:#2b2b2b; color:var(--text); border:1px solid var(--line); border-radius:4px; font:inherit; }
  label { font-size:13px; color:var(--dim); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .row input, .row select { width:auto; margin:0; flex:1; min-width:140px; }
  .err { color:#ff6b6b; min-height:20px; }
  progress { width:100%; height:14px; }
  .form { max-width:520px; }
</style>
</head>
<body>
<header>
  <div class="logo" onclick="show('browse')">TECFLIX</div>
  <nav>
    <button id="nav-browse" onclick="show('browse')">Browse</button>
    <button id="nav-mine" onclick="show('mine')">My Videos</button>
    <button id="nav-upload" onclick="show('upload')">Upload</button>
  </nav>
  <div id="userbox"></div>
</header>

<main>
  <section id="view-browse"><h2>Public videos</h2><div class="grid" id="grid-browse"></div></section>
  <section id="view-mine" hidden><h2>My videos</h2><div class="grid" id="grid-mine"></div></section>
  <section id="view-upload" hidden>
    <h2>Upload a video</h2>
    <div class="form">
      <label>Video file (mp4, m4v, mov, webm, ogv, mkv)</label>
      <input type="file" id="up-file" accept=".mp4,.m4v,.mov,.webm,.ogv,.ogg,.mkv,video/*">
      <label>Title</label>
      <input type="text" id="up-title" maxlength="120" placeholder="Defaults to the file name">
      <label>Visibility</label>
      <select id="up-vis"><option value="private">Private (only me)</option><option value="public">Public (everyone)</option></select>
      <button class="btn red" id="up-btn" onclick="upload()">Upload</button>
      <progress id="up-prog" value="0" max="100" hidden></progress>
      <div class="err" id="up-msg"></div>
    </div>
  </section>
</main>

<div class="modal" id="auth-modal"><div class="box small">
  <button class="close" onclick="closeModal('auth-modal')">&times;</button>
  <h2>Sign in</h2>
  <label>Username</label><input type="text" id="au-user" autocomplete="username">
  <label>Password</label><input type="password" id="au-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')auth('login')">
  <div class="err" id="au-err"></div>
  <div class="row"><button class="btn red" onclick="auth('login')">Log in</button><button class="btn" onclick="auth('register')">Create account</button></div>
</div></div>

<div class="modal" id="video-modal"><div class="box">
  <button class="close" onclick="closePlayer()">&times;</button>
  <video class="player" id="player" controls></video>
  <h2 id="vm-title" style="margin-top:14px"></h2>
  <div id="vm-owner" class="dim"></div>
  <div id="vm-actions"></div>
  <h3>Metadata</h3>
  <table id="vm-meta"></table>
</div></div>

<script>
let me = null, current = null;
const $ = id => document.getElementById(id);

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k in e ? e[k] = v : e.setAttribute(k, v);
  for (const k of kids) e.append(k);
  return e;
}
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const form = o => ({ method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(o) });

const fmtSize = n => { const u = ['B','KB','MB','GB','TB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + ' ' + u[i]; };
const fmtDur = s => { if (!s) return 'Unknown'; s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const fmtDate = t => t ? new Date(t * 1000).toLocaleString() : 'Unknown';
const gcd = (a, b) => b ? gcd(b, a % b) : a;

function renderUser() {
  const box = $('userbox'); box.textContent = '';
  if (me) box.append(el('span', { className: 'dim', textContent: me + ' ' }), el('button', { className: 'btn', textContent: 'Log out', onclick: logout }));
  else box.append(el('button', { className: 'btn red', textContent: 'Log in', onclick: () => openModal('auth-modal') }));
}
function openModal(id) { $(id).classList.add('open'); }
function closeModal(id) { $(id).classList.remove('open'); }

async function show(view) {
  if ((view === 'mine' || view === 'upload') && !me) { openModal('auth-modal'); return; }
  for (const v of ['browse', 'mine', 'upload']) {
    $('view-' + v).hidden = v !== view;
    $('nav-' + v).classList.toggle('active', v === view);
  }
  if (view === 'browse') load('browse');
  if (view === 'mine') load('mine');
}
async function load(which) {
  const grid = $('grid-' + which); grid.textContent = '';
  try {
    const vids = await api('/api/videos' + (which === 'mine' ? '?scope=mine' : ''));
    if (!vids.length) grid.append(el('div', { className: 'empty', textContent: which === 'mine' ? 'You have not uploaded anything yet.' : 'No public videos yet.' }));
    for (const v of vids) grid.append(card(v));
  } catch (e) { grid.append(el('div', { className: 'empty', textContent: e.message })); }
}
function card(v) {
  const badge = el('span', { className: 'badge ' + v.visibility, textContent: v.visibility });
  const sub = el('div', { className: 'dim', textContent: v.owner + ' · ' + fmtDur(v.meta.duration) + ' · ' + fmtSize(v.meta.size) });
  return el('div', { className: 'card', onclick: () => openPlayer(v.id) },
    el('video', { src: '/video/' + v.id + '#t=0.5', preload: 'metadata', muted: true }),
    el('div', { className: 'info' }, el('div', { className: 't' }, v.title, badge), sub));
}

async function openPlayer(id) {
  try { current = await api('/api/videos/' + id); } catch (e) { alert(e.message); return; }
  const v = current, m = v.meta;
  $('player').src = '/video/' + id;
  $('vm-title').textContent = v.title;
  $('vm-owner').textContent = 'Uploaded by ' + v.owner + ' on ' + fmtDate(v.uploaded);
  const acts = $('vm-actions'); acts.textContent = '';
  if (v.isOwner) {
    const title = el('input', { type: 'text', value: v.title, maxLength: 120 });
    const vis = el('select', {}, el('option', { value: 'private', textContent: 'Private' }), el('option', { value: 'public', textContent: 'Public' }));
    vis.value = v.visibility;
    acts.append(el('div', { className: 'row' }, title,
      el('button', { className: 'btn', textContent: 'Rename', onclick: () => update({ title: title.value }) })),
      el('div', { className: 'row' }, el('label', { textContent: 'Visibility' }), vis,
      el('button', { className: 'btn', textContent: 'Apply', onclick: () => update({ visibility: vis.value }) }),
      el('button', { className: 'btn danger', textContent: 'Delete video', onclick: del })));
  }
  const g = gcd(m.width, m.height);
  const rows = [
    ['File name', m.filename], ['File size', fmtSize(m.size)], ['Format', m.mime],
    ['Duration', fmtDur(m.duration)],
    ['Resolution', m.width ? `${m.width} × ${m.height}` + (g ? ` (${m.width/g}:${m.height/g})` : '') : 'Unknown'],
    ['Video codec', m.vcodec || 'Unknown'], ['Audio codec', m.acodec || 'None / unknown'],
    ['Container brand', m.brand || 'Unknown'], ['Tracks', m.tracks || 'Unknown'],
    ['Average bitrate', m.bitrate ? (m.bitrate / 1e6).toFixed(2) + ' Mbit/s' : 'Unknown'],
    ['Media created', fmtDate(m.created)], ['Uploaded', fmtDate(v.uploaded)], ['Visibility', v.visibility],
  ];
  const t = $('vm-meta'); t.textContent = '';
  for (const [k, val] of rows) t.append(el('tr', {}, el('td', { textContent: k }), el('td', { textContent: String(val) })));
  openModal('video-modal');
}
function closePlayer() { const p = $('player'); p.pause(); p.removeAttribute('src'); p.load(); closeModal('video-modal'); refresh(); }
function refresh() { if (!$('view-browse').hidden) load('browse'); if (!$('view-mine').hidden) load('mine'); }

async function update(fields) {
  try { await api('/api/videos/' + current.id, form(fields)); const p = $('player'); const t = p.currentTime; await openPlayer(current.id); p.currentTime = t; }
  catch (e) { alert(e.message); }
}
async function del() {
  if (!confirm('Delete "' + current.title + '" permanently?')) return;
  try { await api('/api/videos/' + current.id, { method: 'DELETE' }); closePlayer(); } catch (e) { alert(e.message); }
}

async function auth(kind) {
  $('au-err').textContent = '';
  try {
    const r = await api('/api/' + kind, form({ username: $('au-user').value, password: $('au-pass').value }));
    me = r.username; $('au-pass').value = ''; closeModal('auth-modal'); renderUser(); refresh();
  } catch (e) { $('au-err').textContent = e.message; }
}
async function logout() { await api('/api/logout', { method: 'POST' }); me = null; renderUser(); show('browse'); }

function upload() {
  const f = $('up-file').files[0], msg = $('up-msg');
  msg.textContent = '';
  if (!f) { msg.textContent = 'Choose a video file first.'; return; }
  const qs = new URLSearchParams({ filename: f.name, title: $('up-title').value, visibility: $('up-vis').value });
  const xhr = new XMLHttpRequest(), prog = $('up-prog');
  xhr.open('POST', '/api/upload?' + qs);
  prog.hidden = false; prog.value = 0; $('up-btn').disabled = true;
  xhr.upload.onprogress = e => { if (e.lengthComputable) prog.value = e.loaded / e.total * 100; };
  xhr.onload = () => {
    $('up-btn').disabled = false; prog.hidden = true;
    let d = {}; try { d = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 201) { $('up-file').value = ''; $('up-title').value = ''; show('mine'); }
    else msg.textContent = d.error || 'Upload failed';
  };
  xhr.onerror = () => { $('up-btn').disabled = false; prog.hidden = true; msg.textContent = 'Network error during upload'; };
  xhr.send(f);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal('auth-modal'); if ($('video-modal').classList.contains('open')) closePlayer(); } });
(async () => { try { me = (await api('/api/me')).username; } catch {} renderUser(); show('browse'); })();
</script>
</body>
</html>
