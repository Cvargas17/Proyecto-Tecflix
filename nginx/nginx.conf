worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Permitir subidas de video hasta 4 GiB
    client_max_body_size 4G;

    # Pool de servidores redundantes (Eliminación de SPOF en APIs)
    upstream tecflix_backend {
        least_conn;
        server tecflix-node-1:8080 max_fails=2 fail_timeout=5s;
        server tecflix-node-2:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name _;

        # Endpoint de salud del balanceador
        location = /lb-health {
            access_log off;
            return 200 '{"status":"healthy","component":"nginx-lb"}';
            add_header Content-Type application/json;
        }

        location / {
            proxy_pass http://tecflix_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Reintento automático ante caída de uno de los nodos
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Streaming directo sin retener archivos en disco temporal de NGINX
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}