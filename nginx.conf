events {
    worker_connections 1024;
}

http {
    # Definición del clúster de microservicios (Nodos A y B)
    upstream tecflix_api_cluster {
        # Reemplazar con las IPs reales de las máquinas virtuales
        # server 192.168.1.10:8080 max_fails=3 fail_timeout=10s; 
        # server 192.168.1.11:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name api.tecflix.local;

        location / {
            proxy_pass http://tecflix_api_cluster;
            
            # Headers para mantener la información original del cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Tiempos de espera para evitar cuellos de botella si un nodo se cuelga
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}